<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>회사 연봉 에이전트 관제실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { base:"#0a0b12", panel:"#12141f", rim:"#242838", ink:"#e8eaf4", dim:"#8d93ab", violet:"#a78bfa", teal:"#2dd4bf", warn:"#fb7185" },
  fontFamily: { sans:['"IBM Plex Sans KR"','"Apple SD Gothic Neo"','"Malgun Gothic"','sans-serif'], mono:['"JetBrains Mono"','ui-monospace','monospace'] }
} } };
</script>
<style>
/* 레이아웃: 왼쪽 레일 + 오른쪽 작업 화면의 관제 콘솔. 보라 = 모델 추론, 청록 = 도구 실행 */
:root { --base:#0a0b12; --panel:#12141f; --rim:#242838; --ink:#e8eaf4; --dim:#8d93ab; --violet:#a78bfa; --teal:#2dd4bf; color-scheme:dark }
html, body { height:100% }
body { background:var(--base); color:var(--ink); }
.num { font-variant-numeric:tabular-nums }
button:focus-visible, .node:focus-visible { outline:2px solid var(--teal); outline-offset:2px }
.tab[aria-current="page"] { background:#1b1e2e; color:var(--ink) }
.tab[aria-current="page"] svg { color:var(--teal) }
.node rect { transition:stroke .2s, fill .2s }
.node.on rect { stroke:var(--teal); fill:#10302f }
.node.pick rect { stroke:var(--violet) }
.node { cursor:pointer; outline:none }
.node text { fill:var(--ink); font-family:"IBM Plex Sans KR","Malgun Gothic",sans-serif }
.node .r { fill:var(--dim) }
.edge { fill:none; stroke:#2c3147 }
.edge.on { stroke:#3f8f8a }
.pulse { animation:p 1.6s ease-in-out infinite } @keyframes p { 50% { opacity:.35 } }
@media (prefers-reduced-motion:reduce) { .pulse { animation:none } }
.bar { position:absolute; top:7px; height:22px; border-radius:5px; min-width:3px }
.bar.m { background:linear-gradient(90deg,#7c5ce0,var(--violet)) }
.bar.t { background:linear-gradient(90deg,#14a896,var(--teal)) }
.scrollx { overflow-x:auto }
</style>

<div class="flex flex-col md:flex-row min-h-full font-sans">
  <nav class="md:w-52 shrink-0 border-b md:border-b-0 md:border-r border-rim flex md:flex-col gap-1 py-3 md:py-5" style="padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px">
    <div class="hidden md:block px-2 pb-5"><p class="font-bold text-[15px]">회사 연봉 에이전트</p><p class="text-xs text-dim mt-0.5">관제실</p></div>
    <button class="tab flex items-center gap-2 px-3 py-2 rounded-md text-sm text-dim hover:text-ink" data-tab="workflows"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="4" cy="5" r="2"/><circle cx="20" cy="5" r="2"/><circle cx="4" cy="19" r="2"/><circle cx="20" cy="19" r="2"/><path d="M6 6l4 4M18 6l-4 4M6 18l4-4M18 18l-4-4"/></svg>Workflows</button>
    <button class="tab flex items-center gap-2 px-3 py-2 rounded-md text-sm text-dim hover:text-ink" data-tab="traces"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h9M8 12h12M4 18h7"/></svg>Traces</button>

    <section id="workflows" class="grid lg:grid-cols-[minmax(0,1fr)_300px] gap-4 flex-1 min-h-0">

      </div>

        </div>
      </div>
    </section>

    <section id="traces" class="grid lg:grid-cols-[290px_minmax(0,1fr)] gap-4 flex-1 min-h-0" hidden>

        <div class="flex flex-wrap items-center gap-x-4 gap-y-2 mb-3">

          <button id="replay" class="ml-auto text-xs border border-rim rounded-md px-3 py-1.5 hover:border-teal">다시 재생</button>
        </div>

          <span class="inline-flex items-center gap-1.5"><i class="w-3 h-2.5 rounded-sm" style="background:var(--teal)"></i>도구 실행</span>
          <span id="runmeta" class="num"></span>
        </div>
        <div class="scrollx"><div class="min-w-[620px]" id="gantt"></div></div>
        <p class="text-xs text-dim mt-3 leading-relaxed">도구 시간은 측정값이에요. 모델 구간은 전체 시간에서 도구 시간을 뺀 뒤 호출 수로 똑같이 나눈 값이에요.</p>
      </div>
    </section>

    <section id="usage" class="grid md:grid-cols-2 xl:grid-cols-3 gap-4" hidden>
      <div class="bg-panel border border-rim rounded-xl p-5 flex flex-col items-center gap-2">
        <p class="text-sm text-dim self-start">자동 평가 통과</p>
        <svg viewBox="0 0 200 200" class="w-44 max-w-full" id="ring1"></svg>
        <p class="text-sm text-dim" id="ring1cap"></p>
      </div>
      <div class="bg-panel border border-rim rounded-xl p-5 flex flex-col gap-4">
        <p class="text-sm text-dim">한 번에 걸리는 시간, 같은 눈금으로</p>
        <div id="compare" class="flex flex-col gap-3"></div>
        <div class="grid grid-cols-2 gap-3 mt-auto" id="stats"></div>
      </div>
      <div class="bg-panel border border-rim rounded-xl p-5 flex flex-col items-center gap-2">
        <p class="text-sm text-dim self-start">전체 시간 중 모델 추론 비중</p>
        <svg viewBox="0 0 200 200" class="w-44 max-w-full" id="ring2"></svg>
        <p class="text-sm text-dim" id="ring2cap"></p>
      </div>
      <div class="bg-panel border border-rim rounded-xl p-5 xl:col-span-2 min-w-0">
        <p class="text-sm text-dim mb-3">질문 유형별 평균 토큰</p>
        <div id="types" class="grid md:grid-cols-2 gap-x-8 gap-y-2.5"></div>
      </div>
      <div class="bg-panel border border-rim rounded-xl p-5 min-w-0">
        <p class="text-sm text-dim mb-3">채점 기준별 통과</p>
        <div id="crit" class="flex flex-col gap-2"></div>
      </div>
    </section>
  </main>
</div>

DATA.forEach((q, i) => {
  const b = document.createElement("button"); b.className = "text-left px-3 py-2 rounded-lg hover:bg-[#1b1e2e]"; b.dataset.r = i;
  b.innerHTML = `<span class="block text-sm leading-snug">${esc(q.q)}</span><span class="block text-xs mt-0.5 num text-dim">${q.id} · ${q.type} · ${q.seconds}초 · <span class="${q.pass ? "text-teal" : "text-warn"}">${q.pass ? "통과" : "실패"}</span></span>`;
  b.onclick = () => { run = i; drawRun(); }; $("runs").appendChild(b);
});
function drawRun() {
  [...$("runs").children].forEach((b, i) => b.style.background = i === run ? "#1b1e2e" : "");
  const q = DATA[run], st = spans(q), T = st.reduce((m, x) => Math.max(m, x.s + x.d), 0), step = T > 20 ? 5 : T > 8 ? 2 : 1, max = Math.ceil(T / step) * step;
  $("runname").textContent = q.q;
  $("runmeta").textContent = `총 ${q.seconds}초 · 모델 호출 ${q.calls}번 · 도구 ${q.trace.length}번 · 토큰 ${n(q.input + q.output)}`;
  let h = `<div class="relative h-5 ml-[200px] font-mono text-[11px] text-dim">`;
  for (let s = 0; s <= max + 1e-6; s += step) h += `<span class="absolute" style="left:${s / max * 100}%;transform:translateX(${s >= max ? "-100%" : s === 0 ? "0" : "-50%"})">${s}초</span>`;
  h += `</div><div class="relative">`;
  st.forEach((x) => {
    const lab = x.d < 10 ? x.d.toFixed(2) : x.d.toFixed(1);
    h += `<div class="flex items-center h-9 border-t border-rim/60"><div class="w-[200px] shrink-0 pr-3"><p class="text-sm leading-tight truncate">${esc(x.a)}</p><p class="text-[11px] text-dim leading-tight truncate">${esc(x.b)}</p></div>
      <div class="relative flex-1 h-9"><div class="bar ${x.k}" data-s="${x.s}" data-d="${x.d}" style="left:${x.s / max * 100}%;width:${x.d / max * 100}%"></div>
      <span class="absolute top-2 font-mono text-[11px] text-dim num" style="${(x.s + x.d) / max > .84 ? `right:${100 - x.s / max * 100 + .8}%` : `left:calc(${(x.s + x.d) / max * 100}% + 8px)`}">${lab}초</span></div></div>`;
  });
  h += `<div id="head" class="absolute top-0 bottom-0 w-px bg-teal" style="left:calc(200px + (100% - 200px) * ${T / max})"></div></div>`;
  $("gantt").innerHTML = h;
  cancelAnimationFrame(raf);
  if (still) { $("head").style.display = "none"; return; }
  const bars = [...$("gantt").querySelectorAll(".bar")], go = performance.now(), L = 2600;
  (function tick(now) {
    const p = Math.min(1, (now - go) / L), cur = p * T;
    bars.forEach((b) => { const s = +b.dataset.s, d = +b.dataset.d; b.style.width = Math.max(0, Math.min(d, cur - s)) / max * 100 + "%"; b.style.opacity = cur >= s ? 1 : 0; });
    $("head").style.left = `calc(200px + (100% - 200px) * ${cur / max})`;
    if (p < 1) raf = requestAnimationFrame(tick); else $("head").style.display = "none";
  })(go);
}
$("replay").onclick = drawRun;

/* ---- 효율 ---- */
function ring(svg, pct, color, big, small) {
  svg.innerHTML = ""; const R = 82, L = 2 * Math.PI * R;
  el(svg, "circle", { cx: 100, cy: 100, r: R, fill: "none", stroke: "#242838", "stroke-width": 14 });
  const a = el(svg, "circle", { cx: 100, cy: 100, r: R, fill: "none", stroke: color, "stroke-width": 14, "stroke-linecap": "round", transform: "rotate(-90 100 100)", "stroke-dasharray": L, "stroke-dashoffset": L * (1 - pct / 100) });
  el(svg, "text", { x: 100, y: 106, "text-anchor": "middle", fill: "#e8eaf4", "font-size": 34, "font-weight": 700, "font-family": "JetBrains Mono,monospace" }, big);
  el(svg, "text", { x: 100, y: 130, "text-anchor": "middle", fill: "#8d93ab", "font-size": 13, "font-family": "IBM Plex Sans KR,sans-serif" }, small);
  if (still) return; const go = performance.now();
  (function f(now) { const p = Math.min(1, (now - go) / 1000), e = 1 - (1 - p) ** 3; a.setAttribute("stroke-dashoffset", L * (1 - pct / 100 * e)); if (p < 1) requestAnimationFrame(f); })(go);
}
const hbar = (w, c, h) => `<div class="${h || "h-2.5"} rounded bg-[#1b1e2e] overflow-hidden"><div class="h-full rounded" style="width:${w}%;min-width:3px;background:${c}"></div></div>`;
function drawUsage() {
  const passed = DATA.filter((q) => q.pass).length, secs = avg(DATA.map((q) => q.seconds)), toks = DATA.map((q) => q.input + q.output);
  const toolTotal = allCalls.reduce((s, c) => s + c.seconds, 0), allSec = DATA.reduce((s, q) => s + q.seconds, 0), toolAvg = avg(allCalls.map((c) => c.seconds));
  ring($("ring1"), passed / DATA.length * 100, "#2dd4bf", `${passed}/${DATA.length}`, "통과");
  $("ring1cap").textContent = "실패 1개는 금액을 옮겨 적다 틀린 경우";
  const mp = (1 - toolTotal / allSec) * 100;
  ring($("ring2"), mp, "#a78bfa", mp.toFixed(0) + "%", "모델 추론");
  $("ring2cap").textContent = `도구 실행은 평균 ${toolAvg.toFixed(2)}초로 거의 즉시`;
  const top = secs;
  $("compare").innerHTML = [["도구 한 번 (AI 없이 데이터 조회)", toolAvg.toFixed(2) + "초", toolAvg / top * 100, "#2dd4bf"], ["AI 답변 한 번", secs.toFixed(1) + "초", 100, "#a78bfa"]].map(([a, b, w, c]) =>
    `<div><div class="flex justify-between gap-3 text-sm"><span>${a}</span><span class="font-mono text-dim num">${b}</span></div><div class="mt-1.5">${hbar(w, c, "h-3")}</div></div>`).join("");
  $("stats").innerHTML = [["질문당 토큰", n(avg(toks))], ["평가 전체 토큰", n(toks.reduce((s, x) => s + x, 0))], ["질문당 모델 호출", avg(DATA.map((q) => q.calls)).toFixed(1) + "번"], ["실행 비용", "무료 API"]].map(([a, b]) =>
    `<div><p class="text-xs text-dim">${a}</p><p class="font-mono text-lg num">${b}</p></div>`).join("");
  const types = {}; DATA.forEach((q) => (types[q.type] = types[q.type] || []).push(q.input + q.output));
  const rows = Object.entries(types).map(([k, v]) => [k, avg(v), v.length]).sort((a, b) => b[1] - a[1]), mx = rows[0][1];
  $("types").innerHTML = rows.map(([k, v, c]) => `<div class="grid grid-cols-[92px_minmax(0,1fr)_62px] items-center gap-3 text-sm"><span class="truncate">${k} <span class="text-dim text-xs">${c}</span></span>${hbar(v / mx * 100, "#a78bfa")}<span class="font-mono text-xs text-dim text-right num">${n(v)}</span></div>`).join("");
  const crit = {}; DATA.forEach((q) => { for (const k in q.checks) { crit[k] = crit[k] || [0, 0]; crit[k][1]++; if (q.checks[k]) crit[k][0]++; } });
  $("crit").innerHTML = Object.entries(crit).map(([k, [a, b]]) => `<div class="grid grid-cols-[84px_minmax(0,1fr)_48px] items-center gap-3 text-sm"><span class="truncate">${k}</span>${hbar(a / b * 100, a === b ? "#2dd4bf" : "#fb7185")}<span class="font-mono text-xs text-dim text-right num">${a}/${b}</span></div>`).join("");
}

/* ---- 탭 ---- */
function show(tab) {
  if (!TITLES[tab]) tab = "workflows";
  for (const k in TITLES) $(k).hidden = k !== tab;
  document.querySelectorAll(".tab").forEach((b) => b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  $("title").textContent = TITLES[tab];
  if (tab === "workflows") startFlow(); else { running = false; $("now").textContent = ""; }
  if (tab === "traces") drawRun();
  if (tab === "usage") drawUsage();
}
document.querySelectorAll(".tab").forEach((b) => b.onclick = () => { location.hash = b.dataset.tab; show(b.dataset.tab); });
addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
